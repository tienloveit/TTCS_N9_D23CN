spring:
  config:
    import: optional:file:./.env[.properties], optional:file:./backend/.env[.properties]

  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Giờ rạp cho phiên MySQL: CURRENT_TIMESTAMP/NOW() trong DEFAULT, ON UPDATE và SQL thuần
      # khớp với Clock của ứng dụng (Asia/Ho_Chi_Minh, không có giờ mùa hè) dù server MySQL chạy UTC.
      connection-init-sql: SET time_zone = '+07:00'
  # Flyway tạo và nâng cấp schema; Hibernate chỉ kiểm tra entity khớp schema.
  flyway:
    locations: classpath:db/migration
    # Database đã có bảng từ trước Flyway: đánh dấu là V1 rồi chạy tiếp V2 trở đi.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schema co tu truoc Flyway
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    # Không giữ EntityManager mở tới hết request: mọi truy cập quan hệ lazy phải nằm trong
    # transaction của service. ReadEndpointsSmokeTest gọi các API đọc để bắt lỗi lazy loading.
    open-in-view: false
    properties:
      hibernate:
        # Quan hệ lazy được tải theo lô (tối đa 50 khóa mỗi truy vấn) khi duyệt danh sách,
        # thay vì một truy vấn cho mỗi phần tử.
        default_batch_fetch_size: 50

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - openid
              - profile
              - email
server:
  port: 8081
  servlet:
    context-path: /api

jwt:
  secret-key: ${JWT_SECRET_KEY}

app:
  oauth2:
    redirect-success-url: ${APP_OAUTH2_SUCCESS_URL:http://localhost:5173/oauth2/callback}
    redirect-failure-url: ${APP_OAUTH2_FAILURE_URL:http://localhost:5173/login}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  secret-key: ${VNPAY_SECRET_KEY}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
  return-url: http://localhost:5173/payment/vnpay-return
